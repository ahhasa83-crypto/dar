let state = JSON.parse(localStorage.getItem('mthaq_state')) || DEFAULT_STATE;

function saveState() {
localStorage.setItem('mthaq_state', JSON.stringify(state));
}

function toggleDarkMode() {
state.theme = state.theme === 'light' ? 'dark' : 'light';
localStorage.setItem('theme', state.theme);
applyTheme();
}

function applyTheme() {
if (state.theme === 'dark') {
document.documentElement.classList.add('dark');
} else {
document.documentElement.classList.remove('dark');
}
}
applyTheme();

// ==========================================
// 2. UI UTILITIES (Toasts & Modals)
// ==========================================
function showToast(message, type = 'success') {
const container = document.getElementById('toast-container');
const toast = document.createElement('div');
const isSuccess = type === 'success';
toast.className = `glass border ${isSuccess ? 'border-emerald-500/30 text-emerald-600 dark:text-emerald-400' : 'border-rose-500/30 text-rose-600 dark:text-rose-400'} px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-bold transition-all duration-300 toast-enter pointer-events-auto`;
toast.innerHTML = `<div class="p-1 rounded-lg ${isSuccess ? 'bg-emerald-500/10' : 'bg-rose-500/10'}"><i data-lucide="${isSuccess ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5"></i></div><span>${message}</span>`;
container.appendChild(toast);
lucide.createIcons();

setTimeout(() => toast.classList.add('toast-show'), 10);
setTimeout(() => {
toast.classList.remove('toast-show');
setTimeout(() => toast.remove(), 300);
}, 3200);
}

function openModal(contentHtml) {
const container = document.getElementById('modal-container');
const content = document.getElementById('modal-content');
content.innerHTML = contentHtml + `<button onclick="closeModal()" class="absolute top-5 left-5 p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i data-lucide="x" class="w-5 h-5"></i></button>`;
container.classList.remove('hidden');
lucide.createIcons();
}

function closeModal() {
document.getElementById('modal-container').classList.add('hidden');
}

// ==========================================
// 3. ROUTER & PAGES RENDERER
// ==========================================
function navigateTo(route) {
window.location.hash = route;
}

window.addEventListener('hashchange', router);
window.addEventListener('load', router);

function router() {
const path = window.location.hash.replace('#', '') || '/';
const app = document.getElementById('app');

if (path === '/') renderLanding(app);
else if (path === '/menu') renderPublicMenu(app);
else if (path === '/cart') renderCartPage(app);
else if (path === '/checkout') renderCheckoutPage(app);
else if (path === '/login') renderLoginPage(app);
else if (path === '/kitchen') renderKitchenView(app);
else if (path.startsWith('/dashboard')) renderDashboardLayout(app, path);
else renderLanding(app);

lucide.createIcons();
window.scrollTo(0,0);
}

// ==========================================

function addToCart(productId) {
const product = state.menu.find(m => m.id === productId);
const exist = state.cart.find(c => c.id === productId);
if (exist) {
exist.qty++;
} else {
state.cart.push({ ...product, qty: 1 });
}
saveState();
showToast(`تمت إضافة "${product.name}" إلى السلة`);
router();
}

function removeFromCart(id) {
state.cart = state.cart.filter(c => c.id !== id);

function handleCheckout(e) {
e.preventDefault();
const name = document.getElementById('chk-name').value;
const type = document.getElementById('chk-type').value;
